<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de usuarios · Acme School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js" defer></script>
  <script src="../js/usuarios.js" defer></script>
  <script src="../js/componentes/acme-menu.js" defer></script>
</head>
<body>
  <acme-menu activo="usuarios"></acme-menu>

  <main>
    <section class="panel encabezado-pagina">
      <div>
        <h1>Gestión de usuarios</h1>
        <p class="subtitulo">Crea, actualiza y elimina los usuarios con acceso a la plataforma.</p>
      </div>
    </section>

    <!-- Formulario de creación y actualización -->
    <section class="panel">
      <h2 id="tituloFormulario">Nuevo usuario</h2>
      <form id="formUsuario" class="formulario" novalidate>
        <div class="campo">
          <label for="identificacion">Número de identificación</label>
          <input type="text" id="identificacion" name="identificacion" inputmode="numeric" placeholder="1012345678">
          <p id="error-identificacion" class="error"></p>
        </div>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ana María Pérez">
          <p id="error-nombre" class="error"></p>
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ana.perez@acme.edu.co">
          <p id="error-email" class="error"></p>
        </div>
        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" inputmode="numeric" placeholder="3001234567">
          <p id="error-telefono" class="error"></p>
        </div>
        <div class="campo">
          <label for="cargo">Cargo</label>
          <select id="cargo" name="cargo">
            <option value="">Selecciona un cargo</option>
            <option value="Administrativo">Administrativo</option>
            <option value="Docente">Docente</option>
          </select>
          <p id="error-cargo" class="error"></p>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          <p id="error-contrasena" class="error"></p>
        </div>

        <p id="mensajeUsuario" class="mensaje campo-completo" role="alert"></p>

        <div class="acciones">
          <button type="submit" id="btnGuardar" class="btn btn-primario">Crear usuario</button>
          <button type="button" id="btnCancelar" class="btn btn-secundario oculto">Cancelar edición</button>
        </div>
      </form>
    </section>

    <!-- Tabla de usuarios registrados -->
    <section class="panel">
      <div class="encabezado-pagina">
        <h2>Usuarios registrados</h2>
        <p id="resumenUsuarios" class="subtitulo"></p>
      </div>
      <div class="contenedor-tabla">
        <table>
          <thead>
            <tr>
              <th>Identificación</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Cargo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
