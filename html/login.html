<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Acme School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js" defer></script>
  <script src="../js/componentes/acme-menu.js" defer></script>
  <script src="../js/login.js" defer></script>
</head>
<body>
  <acme-menu activo="login"></acme-menu>

  <main class="contenedor-login">
    <section class="panel tarjeta-login">
      <h1>Bienvenido</h1>
      <p class="subtitulo">Ingresa para administrar usuarios y exámenes.</p>

      <form id="formLogin" class="formulario-login" novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="usuario@acme.edu.co" autocomplete="username">
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" autocomplete="current-password">
        </div>
        <p id="mensajeLogin" class="mensaje" role="alert"></p>
        <button type="submit" id="btnIngresar" class="btn btn-primario">Ingresar</button>
      </form>
    </section>
  </main>
</body>
</html>
